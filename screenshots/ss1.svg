<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1118"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff4242"/>
      <stop offset="100%" stop-color="#951b2b"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff2d2d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M0 0 L1600 0 M0 28 L1600 28 M0 56 L1600 56 M0 84 L1600 84" stroke="#ff2d2d" stroke-width="1"/>
    <path d="M0 0 L0 900 M28 0 L28 900 M56 0 L56 900 M84 0 L84 900" stroke="#ff2d2d" stroke-width="1"/>
  </g>

  <rect x="0" y="0" width="1600" height="76" fill="#0d1016" stroke="#ff2d2d"/>
  <text x="42" y="48" fill="#f4f5f7" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="4">CYBERESCAPE</text>
  <text x="42" y="68" fill="#ff4b4b" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="7">OPERATION FIREWALL</text>

  <g font-family="Consolas, monospace" font-size="12" fill="#d7d8dd">
    <rect x="540" y="18" width="160" height="34" rx="6" fill="#121821" stroke="#ff3a3a"/>
    <circle cx="566" cy="35" r="5" fill="#ff4f54"/>
    <text x="579" y="40">LINK: SECURE</text>

    <rect x="710" y="18" width="160" height="34" rx="6" fill="#121821" stroke="#ff3a3a"/>
    <text x="728" y="40">SEC LEVEL: AMBER</text>

    <rect x="880" y="18" width="170" height="34" rx="6" fill="#121821" stroke="#ff3a3a"/>
    <text x="900" y="40">T-MINUS: 09:10</text>

    <rect x="1068" y="18" width="120" height="34" rx="6" fill="#121821" stroke="#ff3a3a"/>
    <text x="1106" y="40">SCORE: 0</text>
  </g>

  <g>
    <rect x="34" y="102" width="278" height="760" fill="url(#panel)" stroke="#ff3a3a" rx="8"/>
    <rect x="34" y="102" width="278" height="45" fill="#0f131c" stroke="#ff3a3a"/>
    <text x="52" y="133" fill="#d7d8dd" font-size="15" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">MISSION NAV</text>

    <rect x="52" y="165" width="242" height="78" fill="#11151d" stroke="#ff3a3a" rx="4"/>
    <text x="72" y="195" fill="#f2f3f5" font-size="16" font-weight="700">01 Digital Footprint</text>
    <text x="72" y="220" fill="#fca5a5" font-size="12" letter-spacing="2">ACTIVE</text>

    <rect x="52" y="255" width="242" height="78" fill="#11151d" stroke="#32384a" rx="4"/>
    <text x="72" y="285" fill="#f2f3f5" font-size="16" font-weight="700">02 Encrypted Message</text>
    <text x="72" y="311" fill="#a1a4af" font-size="12" letter-spacing="2">LOCKED</text>

    <rect x="52" y="345" width="242" height="78" fill="#11151d" stroke="#32384a" rx="4"/>
    <text x="72" y="375" fill="#f2f3f5" font-size="16" font-weight="700">03 Access Recovery</text>
    <text x="72" y="401" fill="#a1a4af" font-size="12" letter-spacing="2">LOCKED</text>

    <text x="52" y="470" fill="#d7d8dd" font-size="15" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">OPERATION PROGRESS</text>
    <text x="52" y="495" fill="#a2a7b2" font-size="12">0 / 3 missions</text>
    <rect x="52" y="505" width="242" height="10" fill="#121821" stroke="#ff3a3a" rx="8"/>
    <rect x="52" y="505" width="0" height="10" fill="#ff3a3a" rx="8"/>
  </g>

  <g filter="url(#softGlow)">
    <rect x="334" y="102" width="930" height="760" fill="url(#panel)" stroke="#ff3a3a" rx="8"/>
    <rect x="334" y="102" width="930" height="44" fill="#0f131c" stroke="#ff3a3a"/>
    <text x="370" y="131" fill="#d7d8dd" font-size="15" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">ANALYST TERMINAL · SIMULATED SHELL</text>

    <rect x="356" y="160" width="886" height="620" fill="#070b12" stroke="#3a4052"/>
    <g font-family="Consolas, monospace" font-size="17" fill="#ff5b5b">
      <text x="385" y="202">inspect &lt;file&gt; — metadata and indicators</text>
      <text x="385" y="228">clues — discovered clues</text>
      <text x="385" y="254">hint — guidance (−25 score)</text>
      <text x="385" y="280">submit &lt;filename&gt; — accuse a file</text>
      <text x="385" y="306">clear — clear terminal</text>
      <text x="385" y="332">history — recent commands</text>

      <text x="385" y="380">root@firewall:~$ help — list commands</text>
      <text x="385" y="405">Available commands for Mission 01:</text>
      <text x="385" y="431">help — list commands</text>
      <text x="385" y="457">scan — fictional file inventory</text>
      <text x="385" y="483">inspect &lt;file&gt; — metadata and indicators</text>
      <text x="385" y="509">clues — discovered clues</text>
      <text x="385" y="535">hint — guidance (−25 score)</text>
      <text x="385" y="561">submit &lt;filename&gt; — accuse a file</text>
      <text x="385" y="587">clear — clear terminal</text>
      <text x="385" y="613">history — recent commands</text>
      <text x="385" y="650">root@firewall:~$ scan - fictional file inventory</text>
      <text x="385" y="680">SIMULATED INVENTORY — no live filesystem accessed</text>
      <text x="385" y="706">quarterly_report.pdf 2.14 MB</text>
      <text x="385" y="732">standup_notes.txt 12 KB</text>
      <text x="385" y="758">ops_memo.pdf.exe 847 KB</text>
    </g>

    <g font-family="Consolas, monospace" font-size="18">
      <rect x="356" y="795" width="886" height="56" fill="#0f131b" stroke="#ff3a3a"/>
      <text x="378" y="830" fill="#ff3a3a" font-weight="700">root@firewall:~$</text>
      <rect x="540" y="808" width="530" height="28" fill="#0a0d13" stroke="#4b5364"/>
      <text x="550" y="828" fill="#e8ebf1">enter command — try help</text>
      <rect x="1078" y="809" width="10" height="18" fill="#ff3a3a"/>
    </g>
  </g>

  <g>
    <rect x="1276" y="102" width="290" height="760" fill="url(#panel)" stroke="#ff3a3a" rx="8"/>
    <rect x="1276" y="102" width="290" height="44" fill="#0f131c" stroke="#ff3a3a"/>
    <text x="1304" y="131" fill="#d7d8dd" font-size="15" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">MISSION INTEL</text>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="1304" y="185" fill="#d7d8dd" font-size="18" font-weight="700">BRIEFING</text>
      <text x="1304" y="220" fill="#a1a4af" font-size="14">A planted payload is hiding in the simulated file inventory.</text>
      <text x="1304" y="240" fill="#a1a4af" font-size="14">Scan the workspace, inspect metadata, and submit the</text>
      <text x="1304" y="260" fill="#a1a4af" font-size="14">filename that matches the threat indicators.</text>

      <text x="1304" y="310" fill="#d7d8dd" font-size="18" font-weight="700">OBJECTIVES</text>
      <g fill="#d7d8dd" font-size="14">
        <rect x="1304" y="330" width="240" height="36" fill="#11151d" stroke="#3a4052"/>
        <text x="1326" y="353">[ ] Run scan to list files</text>

        <rect x="1304" y="376" width="240" height="36" fill="#11151d" stroke="#3a4052"/>
        <text x="1326" y="399">[ ] Inspect metadata</text>

        <rect x="1304" y="422" width="240" height="36" fill="#11151d" stroke="#3a4052"/>
        <text x="1326" y="445">[ ] Submit suspicious file</text>
      </g>

      <text x="1304" y="500" fill="#d7d8dd" font-size="18" font-weight="700">DISCOVERED CLUES</text>
      <rect x="1304" y="520" width="240" height="40" fill="#11151d" stroke="#3a4052"/>
      <text x="1326" y="546" fill="#a1a4af" font-size="13">No clues recovered yet.</text>

      <text x="1304" y="595" fill="#d7d8dd" font-size="18" font-weight="700">SCORE</text>
      <rect x="1304" y="610" width="240" height="110" fill="#11151d" stroke="#ff3a3a"/>
      <text x="1332" y="670" fill="#f2f3f5" font-size="42" font-weight="700">0</text>
      <text x="1308" y="700" fill="#a1a4af" font-size="12">M1 +300 · M2 +400 · M3 +500</text>
      <text x="1308" y="718" fill="#a1a4af" font-size="12">Time bonus = remaining seconds</text>
      <text x="1308" y="736" fill="#a1a4af" font-size="12">Each hint −25 (score never goes below 0)</text>

      <text x="1304" y="780" fill="#d7d8dd" font-size="18" font-weight="700">COMMAND HISTORY</text>
      <text x="1304" y="807" fill="#a1a4af" font-size="12">scan — fictional file inventory</text>
      <text x="1304" y="828" fill="#a1a4af" font-size="12">help — list commands</text>
    </g>
  </g>
</svg>

